<svg width="800" height="180" viewBox="0 0 800 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #0d0d0f; }
      .name {
        font-family: 'Courier New', monospace;
        font-size: 52px;
        font-weight: 700;
        fill: #ffffff;
        letter-spacing: 2px;
      }
      .name-blue {
        font-family: 'Courier New', monospace;
        font-size: 52px;
        font-weight: 700;
        fill: #7aa2f7;
        letter-spacing: 2px;
        opacity: 0;
        animation: glitch1 4s infinite;
      }
      .name-red {
        font-family: 'Courier New', monospace;
        font-size: 52px;
        font-weight: 700;
        fill: #f7768e;
        letter-spacing: 2px;
        opacity: 0;
        animation: glitch2 4s infinite;
      }
      .tagline {
        font-family: 'Courier New', monospace;
        font-size: 14px;
        fill: #7aa2f7;
        letter-spacing: 3px;
        opacity: 0.75;
      }
      .p { animation: float linear infinite; }
      @keyframes glitch1 {
        0%,85%,100% { opacity:0; transform:translateX(0); }
        86%,88%      { opacity:1; transform:translateX(-5px); clip-path:polygon(0 20%,100% 20%,100% 45%,0 45%); }
        87%,89%      { transform:translateX(5px); }
        90%           { opacity:0; }
      }
      @keyframes glitch2 {
        0%,87%,100% { opacity:0; transform:translateX(0); }
        88%,90%      { opacity:1; transform:translateX(5px);  clip-path:polygon(0 55%,100% 55%,100% 80%,0 80%); }
        89%,91%      { transform:translateX(-5px); }
        92%           { opacity:0; }
      }
      @keyframes float0 { from{transform:translate(0,0)} to{transform:translate(8px,-180px)} }
      @keyframes float1 { from{transform:translate(0,0)} to{transform:translate(-10px,-180px)} }
      @keyframes float2 { from{transform:translate(0,0)} to{transform:translate(6px,-180px)} }
      @keyframes float3 { from{transform:translate(0,0)} to{transform:translate(-7px,-180px)} }
      @keyframes float4 { from{transform:translate(0,0)} to{transform:translate(12px,-180px)} }
    </style>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip-top"><rect x="0" y="30" width="800" height="45"/></clipPath>
    <clipPath id="clip-bot"><rect x="0" y="100" width="800" height="45"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="180" class="bg" rx="12"/>

  <!-- Grid lines subtle -->
  <line x1="0" y1="60" x2="800" y2="60" stroke="#1a1a2e" stroke-width="1"/>
  <line x1="0" y1="120" x2="800" y2="120" stroke="#1a1a2e" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="180" stroke="#1a1a2e" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="180" stroke="#1a1a2e" stroke-width="1"/>

  <!-- Particles -->
  <circle class="p" cx="60"  cy="160" r="1.5" fill="#7aa2f7" opacity="0.7" style="animation:float0 6s linear infinite;"/>
  <circle class="p" cx="130" cy="170" r="1"   fill="#f7768e" opacity="0.5" style="animation:float1 8s 1s linear infinite;"/>
  <circle class="p" cx="320" cy="165" r="1.2" fill="#9ece6a" opacity="0.6" style="animation:float2 7s 2s linear infinite;"/>
  <circle class="p" cx="500" cy="155" r="1"   fill="#7dcfff" opacity="0.5" style="animation:float3 9s 0.5s linear infinite;"/>
  <circle class="p" cx="680" cy="168" r="1.5" fill="#7aa2f7" opacity="0.7" style="animation:float4 6.5s 3s linear infinite;"/>
  <circle class="p" cx="740" cy="160" r="1"   fill="#f7768e" opacity="0.5" style="animation:float1 7.5s 1.5s linear infinite;"/>
  <circle class="p" cx="220" cy="170" r="1.2" fill="#bb9af7" opacity="0.6" style="animation:float0 8.5s 2.5s linear infinite;"/>
  <circle class="p" cx="460" cy="162" r="1"   fill="#9ece6a" opacity="0.5" style="animation:float2 6s 0.8s linear infinite;"/>

  <!-- Glow blob behind name -->
  <ellipse cx="400" cy="88" rx="220" ry="45" fill="#7aa2f7" opacity="0.04"/>

  <!-- Main name -->
  <text x="400" y="104" text-anchor="middle" class="name" filter="url(#glow)">Kaiki Ribeiro</text>

  <!-- Glitch layers -->
  <g clip-path="url(#clip-top)">
    <text x="400" y="104" text-anchor="middle" class="name-blue">Kaiki Ribeiro</text>
  </g>
  <g clip-path="url(#clip-bot)">
    <text x="400" y="104" text-anchor="middle" class="name-red">Kaiki Ribeiro</text>
  </g>

  <!-- Tagline -->
  <text x="400" y="138" text-anchor="middle" class="tagline">// desenvolvedor</text>

  <!-- Corner accents -->
  <polyline points="12,30 12,12 30,12" fill="none" stroke="#7aa2f7" stroke-width="1.5" opacity="0.5"/>
  <polyline points="770,12 788,12 788,30" fill="none" stroke="#7aa2f7" stroke-width="1.5" opacity="0.5"/>
  <polyline points="12,150 12,168 30,168" fill="none" stroke="#7aa2f7" stroke-width="1.5" opacity="0.5"/>
  <polyline points="770,168 788,168 788,150" fill="none" stroke="#7aa2f7" stroke-width="1.5" opacity="0.5"/>
</svg>
